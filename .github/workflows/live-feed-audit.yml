name: TenderScout Live Feed Audit

on:
  workflow_dispatch:
  schedule:
    # Run every 6 hours; live-feed collection is kept separate from code tests.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect tenders (CSV for audit)
        run: python tenderscout.py --days 60 --pages 1 --region "Target area" --min-score 3

      - name: Save CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenderscout-results
          path: "*.csv"
          if-no-files-found: ignore
          retention-days: 7

      # Optional live refresh; requires the repository variable and secrets below.
      - name: Refresh hosted app
        if: ${{ vars.TENDERSCOUT_APP_URL != '' }}
        env:
          APP_URL: ${{ vars.TENDERSCOUT_APP_URL }}
          APP_USER: ${{ secrets.TENDERSCOUT_APP_USER }}
          APP_PASSWORD: ${{ secrets.TENDERSCOUT_APP_PASSWORD }}
        run: |
          test -n "$APP_USER" && test -n "$APP_PASSWORD"
          curl --fail --show-error --silent --max-time 180 \
            -X POST -u "$APP_USER:$APP_PASSWORD" "$APP_URL/api/refresh"
