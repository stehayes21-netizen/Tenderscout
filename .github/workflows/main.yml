name: TenderScout Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Every 6 hours. Tender notices do not change minute to minute.
    - cron: "17 */6 * * *"

# Keep test runs grouped by ref/PR, but do not cancel a live-source audit
# halfway through when a push and pull_request event overlap. The collector has
# a job timeout and per-source limits; completed audit artifacts are valuable.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile tenderscout.py app.py

      - name: Run unit tests
        run: python -m unittest discover -v

      # Focus on the recent notice window and follow pagination beyond the first 100 releases.
      # Two weeks keeps the audit bounded; ten pages per window is a maximum, not a requirement.
      - name: Collect tenders (CSV for audit)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: python tenderscout.py --days 10 --pages 10 --fts-only --notice-id 098300-2026 --region "Target area" --min-score 3

      - name: Save CSV results
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: tenderscout-results
          path: "*.csv"
          if-no-files-found: ignore
          retention-days: 7

      # Optional: refresh the live site. Needs the repository variable
      # TENDERSCOUT_APP_URL (for example https://tenderscout-1qnz.onrender.com)
      # and the secrets TENDERSCOUT_APP_USER / TENDERSCOUT_APP_PASSWORD.
      - name: Refresh hosted app
        if: ${{ vars.TENDERSCOUT_APP_URL != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          APP_URL: ${{ vars.TENDERSCOUT_APP_URL }}
          APP_USER: ${{ secrets.TENDERSCOUT_APP_USER }}
          APP_PASSWORD: ${{ secrets.TENDERSCOUT_APP_PASSWORD }}
        run: |
          # Starting a refresh returns quickly; the collector runs in a tracked background job.
          # Never retry the POST automatically: the status endpoint is used for polling instead.
          curl --fail --show-error --silent --max-time 20 \
            -X POST -u "$APP_USER:$APP_PASSWORD" "$APP_URL/api/refresh"
          for attempt in $(seq 1 36); do
            state_json=$(curl --fail --show-error --silent --max-time 20 \
              -u "$APP_USER:$APP_PASSWORD" "$APP_URL/api/refresh/status")
            status=$(printf '%s' "$state_json" | python -c "import json,sys; print(json.load(sys.stdin).get('status', 'unknown'))")
            if [ "$status" = "completed" ]; then
              printf '%s\n' "$state_json"
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              printf '%s\n' "$state_json"
              echo "TenderScout refresh failed."
              exit 1
            fi
            sleep 10
          done
          echo "TenderScout refresh was still running after six minutes."
          exit 1
