name: TenderScout Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Every 6 hours. Tender notices do not change minute to minute.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile tenderscout.py app.py

      - name: Run unit tests
        run: python -m unittest discover -v

      # Isolated branch validation uses a bounded live-feed sample.
      - name: Collect tenders (CSV for audit)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/fix/refresh-test-and-all-trades' || github.ref == 'refs/heads/test/live-feed-validation'))
        run: python tenderscout.py --days 14 --pages 1 --region "Target area" --min-score 3

      - name: Save CSV results
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/fix/refresh-test-and-all-trades' || github.ref == 'refs/heads/test/live-feed-validation')))
        uses: actions/upload-artifact@v4
        with:
          name: tenderscout-results
          path: "*.csv"
          if-no-files-found: ignore
          retention-days: 7

      # Optional: refresh the live site. Needs the repository variable
      # TENDERSCOUT_APP_URL (for example https://tenderscout-1qnz.onrender.com)
      # and the secrets TENDERSCOUT_APP_USER / TENDERSCOUT_APP_PASSWORD.
      - name: Refresh hosted app
        if: ${{ vars.TENDERSCOUT_APP_URL != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          APP_URL: ${{ vars.TENDERSCOUT_APP_URL }}
          APP_USER: ${{ secrets.TENDERSCOUT_APP_USER }}
          APP_PASSWORD: ${{ secrets.TENDERSCOUT_APP_PASSWORD }}
        run: |
          curl --fail --show-error --silent --max-time 180 \
            -X POST -u "$APP_USER:$APP_PASSWORD" "$APP_URL/api/refresh"
