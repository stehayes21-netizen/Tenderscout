name: TenderScout Check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      audit_days:
        description: "Look-back period for the manual Find a Tender audit"
        required: true
        default: "60"
        type: string
      audit_pages:
        description: "Maximum pages per date window"
        required: true
        default: "25"
        type: string
      fts_only:
        description: "Audit Find a Tender only (recommended for pagination diagnosis)"
        required: true
        default: true
        type: boolean
  schedule:
    # Every 6 hours. Tender notices do not change minute to minute.
    - cron: "17 */6 * * *"

# Keep test runs grouped by ref/PR, but do not cancel a live-source audit
# halfway through when a push and pull_request event overlap. Completed audit artifacts are valuable.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Allow a broad manual Find a Tender cursor walk without touching production.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile tenderscout.py app.py

      - name: Run unit tests
        run: python -m unittest discover -v

      # Pull requests use a small smoke audit. Manual runs accept a configurable
      # look-back and page limit; default to a 60-day Find a Tender-only audit.
      # Manual audits never refresh the deployed production app.
      - name: Collect tenders (CSV for audit)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        env:
          AUDIT_DAYS: ${{ inputs.audit_days || '60' }}
          AUDIT_PAGES: ${{ inputs.audit_pages || '25' }}
          FTS_ONLY: ${{ inputs.fts_only }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python tenderscout.py --days 2 --pages 2 --notice-id 098300-2026 --region "Target area" --min-score 3
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$AUDIT_DAYS" =~ ^[1-9][0-9]{0,2}$ ]] || [ "$AUDIT_DAYS" -gt 365 ]; then
              echo "audit_days must be an integer from 1 to 365."
              exit 2
            fi
            if ! [[ "$AUDIT_PAGES" =~ ^[1-9][0-9]{0,2}$ ]] || [ "$AUDIT_PAGES" -gt 100 ]; then
              echo "audit_pages must be an integer from 1 to 100."
              exit 2
            fi
            if [ "$FTS_ONLY" = "true" ]; then
              python tenderscout.py --days "$AUDIT_DAYS" --pages "$AUDIT_PAGES" --fts-only --notice-id 098300-2026 --region "Target area" --min-score 3
            else
              python tenderscout.py --days "$AUDIT_DAYS" --pages "$AUDIT_PAGES" --notice-id 098300-2026 --region "Target area" --min-score 3
            fi
          else
            python tenderscout.py --days 10 --pages 6 --notice-id 098300-2026 --region "Target area" --min-score 3
          fi

      - name: Save CSV results
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: tenderscout-results
          path: "*.csv"
          if-no-files-found: ignore
          retention-days: 7

      # Optional: refresh the live site. Needs the repository variable
      # TENDERSCOUT_APP_URL (for example https://tenderscout-1qnz.onrender.com)
      # and the secrets TENDERSCOUT_APP_USER / TENDERSCOUT_APP_PASSWORD.
      - name: Refresh hosted app
        if: ${{ vars.TENDERSCOUT_APP_URL != '' && github.event_name == 'schedule' }}
        env:
          APP_URL: ${{ vars.TENDERSCOUT_APP_URL }}
          APP_USER: ${{ secrets.TENDERSCOUT_APP_USER }}
          APP_PASSWORD: ${{ secrets.TENDERSCOUT_APP_PASSWORD }}
        run: |
          # Free Render services can take time to wake. Wait for health before
          # starting work, so a cold-start delay does not consume the POST timeout.
          ready=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$APP_URL/health" >/dev/null; then
              ready=1
              break
            fi
            echo "Hosted app not ready yet (attempt $attempt/12); waiting 5 seconds."
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "TenderScout hosted app did not become healthy within about 2 minutes."
            exit 1
          fi

          # Do not automatically retry POST: a timeout could happen after the
          # server accepted the request, which could start duplicate refreshes.
          curl --fail --show-error --silent --max-time 90 \
            -X POST -u "$APP_USER:$APP_PASSWORD" "$APP_URL/api/refresh"

          # The hosted collector has a 15-minute Find a Tender budget. Poll for
          # up to 19 minutes so collection and result persistence can finish.
          for attempt in $(seq 1 114); do
            if ! state_json=$(curl --fail --show-error --silent --max-time 30 \
              -u "$APP_USER:$APP_PASSWORD" "$APP_URL/api/refresh/status"); then
              echo "Could not read refresh status (attempt $attempt/114); retrying status check."
              sleep 10
              continue
            fi
            status=$(printf '%s' "$state_json" | python -c "import json,sys; print(json.load(sys.stdin).get('status', 'unknown'))")
            if [ "$status" = "completed" ]; then
              printf '%s\n' "$state_json"
              exit 0
            fi
            if [ "$status" = "incomplete" ]; then
              printf '%s\n' "$state_json"
              echo "TenderScout refresh finished with incomplete collection."
              exit 1
            fi
            if [ "$status" = "failed" ]; then
              printf '%s\n' "$state_json"
              echo "TenderScout refresh failed."
              exit 1
            fi
            if [ "$status" = "incomplete" ]; then
              printf '%s\n' "$state_json"
              echo "TenderScout refresh saved some results, but collection was incomplete."
              exit 1
            fi
            sleep 10
          done
          echo "TenderScout refresh was still running after nineteen minutes."
          exit 1
