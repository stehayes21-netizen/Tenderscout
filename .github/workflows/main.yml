name: TenderScout Check

on:
workflow_dispatch:
push:
branches:
- main

jobs:
check:
runs-on: ubuntu-latest
steps:
- name: Check out repository
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Check Python syntax
    run: python -m py_compile Tenderscout.py app.py
